<div class="ide-container">
  <div class="ide-main">
    @if (workspaceService.sidebarVisible()) {
      <app-sidebar />
    }

    <main class="ide-editor-area">
      <app-tabs />
      <div class="editor-viewport">
        <app-editor (cursorChange)="onCursorChange($event)" />
      </div>
    </main>
  </div>

  <app-status-bar [cursor]="cursor()" />
  <app-search-modal />
</div>
