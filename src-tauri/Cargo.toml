[package]
name = "vide"
version = "0.2.6"
description = "Vector IDE"
authors = ["Ori Kuttner <ori@heliconbooks.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/OriKuttner/vide"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["devtools"] }
tauri-plugin-log = "2"
base64 = "0.22"
portable-pty = "0.9.0"
